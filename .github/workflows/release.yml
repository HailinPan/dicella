name: Release to PyPI

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Publish
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
