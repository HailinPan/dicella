name: Release to PyPI

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          pip install build twine
          python -m build
          
          echo "📦 Built artifacts:"
          ls -lh dist/
          
          # 严格检查：如果文件名包含 '+'，说明 setuptools-scm 生成了本地版本，立即终止
          if ls dist/*+* 1>/dev/null 2>&1; then
            echo "❌ ERROR: Found local version identifier (+) in dist/"
            echo "   This usually means SETUPTOOLS_SCM_PRETEND_VERSION is not working correctly."
            exit 1
          fi
          
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1